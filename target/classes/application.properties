spring.application.name=pinjam-buku-bce
server.port=8080

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Skema tabel berasal dari schema.sql (rancangan data 8a), data awal dari data.sql.
# validate: aplikasi GAGAL START bila @Entity tidak cocok dengan schema.sql.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
